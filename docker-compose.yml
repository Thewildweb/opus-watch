# Maison & Opus — local WordPress + WooCommerce stack
#
#   docker compose up -d                 core stack (wordpress, db, phpmyadmin)
#   docker compose run --rm wpcli ...     run wp-cli against the site
#   docker compose --profile search up -d adds Elasticsearch (for ElasticPress)
#
# First boot: `docker compose up -d` then `./scripts/install.sh`.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WP_DEBUG}
      # Read by mu-plugins/opus-mail-config.php; never stored in the database.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      WORDPRESS_CONFIG_EXTRA: |
        # Follow the request host so the site also works via the LAN IP.
        $$host = $$_SERVER['HTTP_HOST'] ?? 'localhost:${WP_PORT}';
        define('WP_HOME', "http://$$host");
        define('WP_SITEURL', "http://$$host");
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html
      # Version-controlled custom theme, developed live:
      - ./wp-content/themes/maison-opus:/var/www/html/wp-content/themes/maison-opus
      # Place for our own must-use plugins / snippets:
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins

  # wp-cli — not a long-running service; invoked with `run --rm`.
  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
    user: "33:33" # www-data, matches the wordpress container's file ownership
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/maison-opus:/var/www/html/wp-content/themes/maison-opus
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
    entrypoint: wp
    command: ["--info"]

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M

  # Optional — enable with: docker compose --profile search up -d
  elasticsearch:
    image: elasticsearch:7.17.22
    profiles: ["search"]
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  db_data:
  wp_data:
  es_data:
