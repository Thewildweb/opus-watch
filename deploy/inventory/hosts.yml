all:
  hosts:
    opus-prod:
      ansible_host: 85.17.236.215
  vars:
    ansible_user: erik
    ansible_become: true
    # Sudo password: same as the ODC boxes — `pass projects/ODC-infra/erik-sudo`.
    # Run playbooks with:  --become-password-file <(pass projects/ODC-infra/erik-sudo | head -1)
    # or -K to be prompted.

    site_domain: opus.watches
    site_dir: /opt/opus-watch

    # Secrets come straight from the local password store (no vault file).
    mysql_root_password: "{{ lookup('community.general.passwordstore', 'projects/opus-watch/mysql-root') }}"
    mysql_wordpress_password: "{{ lookup('community.general.passwordstore', 'projects/opus-watch/mysql-wordpress') }}"

    operator_users:
      - name: erik
        shell: /bin/bash
        groups: [sudo, docker]
        password_hash: "{{ lookup('community.general.passwordstore', 'projects/opus-watch/erik-password-hash') }}"
        ssh_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG+p8+Z2MXn/VQo1yDLQF7+wHQw6JAQ/Ifskx2OJOXEB erik@lennie"
          - "ssh-rsa  erik@datadepartment.io"
